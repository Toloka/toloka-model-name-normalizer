ibm = "ibm-granite"                       # watsonx/ibm/granite-3-8b-instruct
minimaxai = "minimax"                     # baseten/MiniMaxAI/MiniMax-M2.5
ai21labs = "ai21"
coherelabs = "cohere"
cohereforai = "cohere"
xiaomimimo = "xiaomi"                     # novita/xiaomimimo/mimo-v2-flash
