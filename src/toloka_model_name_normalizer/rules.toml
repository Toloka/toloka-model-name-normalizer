# The Toloka default rule set of toloka-model-name-normalizer.
#
# Every parsing decision of the library is read from a file of this shape. Override it from outside with
# Rules.load(path) or the environment variable TOLOKA_MODEL_NAME_NORMALIZER_RULES; an override merges over
# this file (tables replace entry by entry, vocabulary lists extend, scalars overwrite) unless it declares
# `extends = false`. Design and the survey behind the entries: README.md, the golden corpus in
# tests/data/golden.json and the LiteLLM catalogue in tests/data/litellm_catalogue.json.
#
# Never in this file: a model catalogue, prices, capabilities, effort variants, config stems. The families
# table names model lines, not models. Per-name overrides live only in [lookup], each with a `why`.

schema_version = 2        # the rule primitives this file uses; the library states which versions it reads
version = "2026.10.30.1"  # this rule set's own version, recorded by every consumer next to its values

# --- routes ------------------------------------------------------------------------------------------------
# A route is a transport namespace that may prefix a model name on the wire, or the `provider` of the
# pair form. `implies_vendor`: the wire name omits the vendor, so a bare name after this route belongs to
# that vendor. A route whose name equals its implied vendor is a direct-vendor route: valid as a provider,
# never peeled from a string (`openai/gpt-6-astra` keeps reading as canonical vendor/model).
# `nestable`: another route may follow it (a proxy). `also_vendor`: the name is a vendor too, so
# `route/name` reads as a route only when the name's family belongs to another vendor. `dotted_vendor`: a
# name spells its vendor as `[region.]vendor.model`. `skip_segments` / `skip_paths`: leading path segments
# of deployment detail (fnmatch, segment by segment). `strip`: regexes removed from the canonical model.
# `decimal_p`: `5p1` is `5.1` in the canonical model. None of them changes the wire.
#
# The route names follow LiteLLM's provider names, the de-facto wire convention; a provider that serves one
# vendor implies it, every other one leaves the vendor to the name or to the families table.

[routes.openrouter]                       # peelable: openrouter/x/y is the wire form of (openrouter, x/y)

[routes.litellm]
nestable = true                           # litellm/openrouter/x/y keeps the chain ("litellm", "openrouter")

[routes.litellm_proxy]
nestable = true                           # a LiteLLM proxy in front of any route: litellm_proxy/bedrock/...

[routes.mock]                             # the engine's mock provider

[routes.platform_openai]
implies_vendor = "openai"                 # LiteLLM gateway route for the direct OpenAI API
nestable = true

[routes.gemini]
implies_vendor = "google"                 # the engine's provider binding for the direct Google API

[routes.openai]
implies_vendor = "openai"                 # direct API: the pair (openai, gpt-6-astra)
nestable = true                           # and the OpenAI-compatible proxy: the pair (openai, azure_ai/<model>)

[routes.anthropic]
implies_vendor = "anthropic"              # direct API: the pair (anthropic, claude-opus-4-6)

[routes.meta]
implies_vendor = "meta"                   # Muse on its own API: the pair (meta, muse-spark-1.2)

[routes.nova]
implies_vendor = "nova"                   # the engine's own Nova namespace: the pair (nova, nova-pro-v1)

# Native APIs that serve one vendor.
[routes.codestral]
implies_vendor = "mistralai"              # codestral/codestral-2405
[routes.text-completion-codestral]
implies_vendor = "mistralai"
[routes.chatgpt]
implies_vendor = "openai"                 # chatgpt/gpt-5.2
[routes.text-completion-openai]
implies_vendor = "openai"
[routes.cohere_chat]
implies_vendor = "cohere"                 # (cohere_chat, command-r-plus)
[routes.amazon-nova]
implies_vendor = "amazon"                 # amazon-nova/nova-pro-v1
[routes.amazon_nova]
implies_vendor = "amazon"
[routes.palm]
implies_vendor = "google"
[routes.v0]
implies_vendor = "vercel"                 # v0/v0-1.5-md

# Cloud platforms.
[routes.azure]                            # Azure OpenAI: azure/<deployment>, data-zone segments in pricing keys
skip_segments = ["eu", "us", "global", "global-standard"]

[routes.azure_ai]                         # Azure AI Foundry: azure_ai/Llama-4-Scout-17B-16E-Instruct
skip_segments = ["global"]

[routes.bedrock]                          # bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0
nestable = true
dotted_vendor = true
regions = ["us", "eu", "apac", "global", "us-gov", "jp", "au", "ca"]
skip_segments = ["converse", "invoke", "*-*-[0-9]", "*-month-commitment", "[*]"]
strip = [':0$']                           # the default revision; anthropic.claude-v2:1 is Claude 2.1 and stays

[routes.bedrock_mantle]                   # bedrock_mantle/openai.gpt-oss-120b
dotted_vendor = true

[routes.sagemaker]

[routes.oci]                              # Oracle Cloud: oci/meta.llama-3.1-405b-instruct
dotted_vendor = true

[routes.vertex_ai]                        # vertex_ai/claude-opus-4-7@default, vertex_ai/meta/llama-...-maas
strip = ['@default$', '-maas$']

[routes.vertex_ai_beta]
strip = ['@default$', '-maas$']

[routes.watsonx]                          # watsonx/ibm/granite-3-8b-instruct

[routes.snowflake]                        # snowflake/claude-sonnet-4-5, and Snowflake's own Arctic
also_vendor = true

[routes.databricks]                       # databricks/databricks-claude-sonnet-4-1, and Databricks' own DBRX
also_vendor = true
strip = ['^databricks-']

[routes.cloudflare]                       # cloudflare/@cf/meta/llama-3.1-8b-instruct
skip_segments = ["@cf"]

# OpenAI-compatible hosts: route/vendor/model or route/<bare name>.
[routes.fireworks_ai]                     # fireworks_ai/accounts/fireworks/models/glm-5p1
skip_paths = ["accounts/*/models", "accounts/*/routers"]
decimal_p = true

