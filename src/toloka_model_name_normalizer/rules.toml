codellama = "meta-llama"                  # anyscale/codellama/CodeLlama-34b-Instruct-hf
sarvam = "sarvamai"                       # sarvam/sarvam-m

[family_vendor_aliases]
"meta/llama" = "meta-llama"               # replicate/meta/llama-3-70b, Bedrock meta.llama3-70b-instruct-v1:0
"meta/codellama" = "meta-llama"
"meta/llamaguard" = "meta-llama"

[bare_names]

# --- families ----------------------------------------------------------------------------------------------
# The vendor of a model line, for a name that spells no vendor (azure/gpt-5.5, claude-opus-4-7). One row per
# family token, the first token after the separators and the glued-letter split (qwen3-max is family qwen,
# o3-mini family o). The table also decides the vendor-token skip: a first token that is no family is
# dropped when the second is one (meta-llama-3.1, cohere-command-a, openai-gpt-5). A naming convention, not a
# catalogue: no model is listed. Vendors are OpenRouter slugs, or the publisher's own organisation where
