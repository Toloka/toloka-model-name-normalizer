# --- vendor aliases and bare names ----------------------------------------------------------------------
# A vendor alias folds a spelling into the vendor's OpenRouter slug, the identity the pricing keys use:
# native API names and Hugging Face organisations. A family-scoped alias folds a spelled vendor for one
# family only: Meta publishes Llama as meta-llama, while Muse stays meta. Bare-name patterns (ordered,
# fnmatch) are for deployments; the default infers a bare name's vendor from the families table below.

[vendor_aliases]
xai = "x-ai"                              # xai/grok-4, the native API
moonshot = "moonshotai"                   # moonshot/kimi-k2.5
mistral = "mistralai"                     # mistral/mistral-large-2512
